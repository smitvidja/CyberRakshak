<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CyberRakshak">
  <!-- A deliberately simplified form of the header mark (logo-v2.webp). The original
       is navy-on-white with a thin ring and a seven-node network iris; at 16px those
       strokes collapse into a smudge. Inverting to a solid navy disc and reducing the
       iris to one dot keeps the same silhouette legible at tab size. -->
  <circle cx="32" cy="32" r="32" fill="#082a45" />
  <path d="M11 32 Q32 8 53 32 Q32 56 11 32 Z" fill="#ffffff" />
  <circle cx="32" cy="32" r="7.5" fill="#f49f5e" />
</svg>
