services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberrakshak-postgres
    environment:
      POSTGRES_DB: cyberrakshak
      POSTGRES_USER: cyberrakshak
      POSTGRES_PASSWORD: cyberrakshak_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberrakshak -d cyberrakshak"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
